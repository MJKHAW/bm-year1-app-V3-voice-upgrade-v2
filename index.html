<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BM Game App</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(#8ee7ff,#fff7d6);
}

/* ===== MAP ===== */
#mapPage{
  padding:20px;
}

.map-title{
  text-align:center;
  font-size:36px;
  color:#01579b;
}

.map-container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:24px;
  margin-top:20px;
}

/* ===== CANVA ISLAND IMAGE ===== */
.island-card{
  height:190px;
  background-image:url("island.png");
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  border:none;
  box-shadow:none;
  cursor:pointer;
  text-align:center;
  color:white;
  position:relative;
  transition:0.2s;
  padding-top:82px;
}

.island-card:hover{
  transform:scale(1.1);
}

.code{
  font-size:18px;
  font-weight:bold;
  text-shadow:2px 2px 4px #000;
}

.name{
  font-size:13px;
  background:rgba(0,0,0,0.35);
  margin:5px auto;
  padding:4px;
  border-radius:10px;
  width:120px;
}

.stars{
  font-size:18px;
  text-shadow:2px 2px 4px #000;
}

/* ===== MAIN APP ===== */
.app{
  display:none;
  max-width:800px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:20px;
}

.word-box{
  font-size:80px;
  text-align:center;
  background:#fff3e0;
  border-radius:20px;
  padding:20px;
}

button{
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-size:16px;
}
</style>
</head>

<body>

<div id="mapPage">
  <h1 class="map-title">🏝 Pilih Kemahiran</h1>
  <div class="map-container" id="mapContainer"></div>
</div>

<div class="app">
  <h2 id="moduleTitle"></h2>
  <div class="word-box" id="word"></div>

  <button onclick="startListening()">🎤 Speak</button>
  <button onclick="nextWord()">Next</button>

  <p id="result"></p>
  <p>Score: <span id="score">0</span></p>

  <button onclick="goBack()">⬅ Back</button>
</div>

<script>
const modules=[
  {name:"BM01 Vokal",words:["a","e","i","o","u"]},
  {name:"BM05 KV",words:["ba","bi","bu","ca"]},
  {name:"BM06 KVK",words:["bas","jam","pen"]}
];

let currentModule=0;
let currentWord=0;
let score=0;

function buildMap(){
  let map=document.getElementById("mapContainer");
  map.innerHTML="";

  modules.forEach((m,i)=>{
    let div=document.createElement("div");
    div.className="island-card";
    div.onclick=()=>openModule(i);

    div.innerHTML=`
      <div class="code">${m.name}</div>
      <div class="name">Klik untuk mula</div>
      <div class="stars">⭐⭐⭐</div>
    `;

    map.appendChild(div);
  });
}

function openModule(i){
  currentModule=i;
  currentWord=0;
  score=0;

  document.getElementById("score").innerHTML=score;
  document.getElementById("result").innerHTML="";

  document.getElementById("mapPage").style.display="none";
  document.querySelector(".app").style.display="block";

  loadWord();
}

function loadWord(){
  document.getElementById("moduleTitle").innerHTML=modules[currentModule].name;
  document.getElementById("word").innerHTML=modules[currentModule].words[currentWord];
}

function nextWord(){
  currentWord++;
  if(currentWord>=modules[currentModule].words.length) currentWord=0;
  loadWord();
}

function startListening(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    document.getElementById("result").innerHTML="❌ Please use Google Chrome";
    return;
  }

  let rec=new SpeechRecognition();
  rec.lang="ms-MY";
  rec.start();

  rec.onresult=function(e){
    let spoken=e.results[0][0].transcript.toLowerCase();
    let correct=modules[currentModule].words[currentWord];

    if(spoken.includes(correct)){
      document.getElementById("result").innerHTML="✅ Betul!";
      score++;
    }else{
      document.getElementById("result").innerHTML="❌ Cuba lagi (" + spoken + ")";
    }

    document.getElementById("score").innerHTML=score;
  }
}

function goBack(){
  document.querySelector(".app").style.display="none";
  document.getElementById("mapPage").style.display="block";
}

buildMap();
</script>

</body>
</html>
